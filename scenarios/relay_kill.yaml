# The relay dies and the swarm replaces it. Chunk 4.2.
#
# architecture.md section 6: common geometry, uav_2 killed at t = 120 s, and
# 180 s of run left after it for the election, the flight and steady state.
# The component {uav_3, uav_4} elects, uav_3 wins by 0.8 m, flies 195.0 m to
# the slot at (317.3, -36.8, 75) and the restored path is
# uav_4 -> uav_3 -> uav_1 -> gcs.
#
# scripts/check_geometry.py holds every number below against its own copy of
# the frozen table, recomputes the slot from the anchor and the surviving
# member, and derives the 32.5 s reconnect budget from the flight rather than
# reading it here.
#
# check_scenario.py requires this to equal the file stem.
name: relay_kill

# link_loss.yaml carries this same seed. The two scenarios are the same fault
# told twice, once as a vehicle that is gone and once as a vehicle that is
# only quiet, and the only honest way to compare them is to draw the fade
# band from the same stream.
seed: 43

# 120 s before the kill, 180 s after it. The derived budget is 32.5 s, so the
# run has more than five times what recovery is supposed to need.
duration_s: 300

vehicles:
  - uav_1
  - uav_2
  - uav_3
  - uav_4

# The relay is killed outright. Nothing comes back, nothing occupies the
# airspace it left, and the swarm has to notice on its own.
injected_events:
  - type: kill
    target: uav_2
    at_s: 120

headless: true

hover_altitudes_m:
  uav_1: 30
  uav_2: 40
  uav_3: 50
  uav_4: 60

comms:
  enabled: true
  forwarding: true

  # On, and this is the scenario they exist for.
  elections_enabled: true

  roles:
    uav_1: gcs_anchor
    uav_2: relay
    uav_3: survey
    uav_4: survey

  stations:
    uav_1: [165.0, 0.0, 30.0]
    uav_2: [330.0, 0.0, 40.0]
    uav_3: [475.0, 75.0, 50.0]
    uav_4: [475.0, -75.0, 60.0]
